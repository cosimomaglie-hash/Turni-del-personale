<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <title>Tabellone Turni Reparto</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icona.png">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* Navbar */
        .app-navbar {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Intestazione Titolo Reparto */
        .reparto-header-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        /* Contenitore Tabellone con scorrimento orizzontale fluido */
        .matrix-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
        }

        .matrix-table {
            border-collapse: separate;
            border-spacing: 0;
            width: max-content;
            min-width: 100%;
            margin-bottom: 0;
        }

        .matrix-table th,
        .matrix-table td {
            border-right: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
            padding: 6px 4px;
            text-align: center;
            vertical-align: middle;
        }

        .matrix-table tr:last-child td {
            border-bottom: none;
        }

        /* Prima colonna fissa (Personale) */
        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 2;
            background-color: #ffffff;
            min-width: 170px;
            max-width: 170px;
            text-align: left !important;
            padding: 8px 12px !important;
            border-right: 2px solid #cbd5e1 !important;
            box-shadow: 2px 0 5px -2px rgba(0,0,0,0.05);
        }

        .matrix-table thead th.sticky-col {
            z-index: 3;
            background-color: #f8fafc;
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.8rem;
        }

        /* Intestazione Giorni */
        .day-header {
            min-width: 44px;
            max-width: 44px;
            background-color: #f8fafc;
            font-size: 0.72rem;
            line-height: 1.2;
        }

        .day-header.weekend {
            background-color: #fef2f2;
            color: #dc2626;
        }

        .cell-weekend {
            background-color: #fffafa;
        }

        /* Badge Sigla nella cella */
        .sigla-pill {
            display: inline-block;
            width: 36px;
            padding: 3px 2px;
            border-radius: 5px;
            font-size: 0.72rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nome-operatore {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .ruolo-operatore {
            font-size: 0.68rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Barra Superiore -->
    <nav class="navbar app-navbar py-3 mb-4">
        <div class="container-fluid px-3 px-md-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <a href="https://turni-personale.vercel.app" class="btn btn-outline-light btn-sm rounded-pill px-3 fw-semibold">⬅️ I Miei Turni</a>
                <span class="navbar-brand mb-0 h1 fw-bold fs-5 text-white ms-1">📊 Tabellone Reparto</span>
            </div>
            <button onclick="caricaDatiTabellone()" class="btn btn-light btn-sm rounded-pill px-3 fw-semibold shadow-sm">🔄 Aggiorna</button>
        </div>
    </nav>

    <div class="container-fluid px-3 px-md-4 pb-5">
        
        <!-- Indicazione del Reparto Attivo -->
        <div class="reparto-header-card mb-4 border d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <span class="text-muted small d-block">Reparto Selezionato</span>
                <h4 id="titolo-reparto" class="fw-bold text-dark mb-0">Caricamento in corso...</h4>
            </div>
            <div class="d-flex flex-wrap gap-2 align-items-center">
                <span class="small text-muted fw-semibold">Legenda:</span>
                <span class="badge bg-primary">Mattina / Altro</span>
                <span class="badge bg-success">Pomeriggio</span>
                <span class="badge bg-danger">Riposo / Ferie</span>
            </div>
        </div>

        <!-- Loader -->
        <div id="loader" class="text-center py-5" style="display: none;">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
            <p id="loader-text" class="mt-3 text-muted fw-medium">Caricamento tabellone in corso...</p>
        </div>

        <!-- Contenitore Tabelle Mensili -->
        <div id="contenitore-mesi" class="d-flex flex-column gap-4">
            <!-- I mesi verranno generati dinamicamente qui -->
        </div>

    </div>

    <script>
        // --- CONFIGURAZIONE SUPABASE ---
        const SUPABASE_URL = 'https://uwoniioltnihmqakkzjv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Rx8MkwKEJLqZBZtbp-2IYw_rFUvKFin';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let repartoCorrente = '';

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            repartoCorrente = urlParams.get('reparto') ? urlParams.get('reparto').trim() : '';

            if (repartoCorrente) {
                document.getElementById('titolo-reparto').innerText = `🏥 ${repartoCorrente}`;
            } else {
                document.getElementById('titolo-reparto').innerText = `🏥 Tutti i Reparti`;
            }

            caricaDatiTabellone();
        };

        async function caricaDatiTabellone() {
            const loader = document.getElementById('loader');
            const contenitore = document.getElementById('contenitore-mesi');
            
            contenitore.innerHTML = '';
            loader.style.display = 'block';

            const ora = new Date();
            const primoGiornoMeseCorrente = `${ora.getFullYear()}-${String(ora.getMonth() + 1).padStart(2, '0')}-01`;

            // Query diretta filtrata sul server Supabase per massima velocità ed efficienza
            let query = supabaseClient
                .from('Turnistica')
                .select('*')
                .gte('Data', primoGiornoMeseCorrente)
                .range(0, 999); // Limite sicuro e rapido

            if (repartoCorrente) {
                query = query.eq('NomeReparto', repartoCorrente);
            }

            const { data, error } = await query.order('Data', { ascending: true });

            loader.style.display = 'none';

            if (error) {
                contenitore.innerHTML = '<div class="alert alert-danger rounded-3 border-0 shadow-sm p-3">Errore di connessione al database. Riprova più tardi.</div>';
                console.error(error);
                return;
            }

            if (!data || data.length === 0) {
                contenitore.innerHTML = `<div class="alert alert-info rounded-3 border-0 shadow-sm p-4 text-center">Nessun turno trovato${repartoCorrente ? ' per il reparto ' + repartoCorrente : ''}.</div>`;
                return;
            }

            renderizzaTabellone(data);
        }

        function renderizzaTabellone(datiFiltrati) {
            const contenitore = document.getElementById('contenitore-mesi');
            contenitore.innerHTML = '';

            const mesiMap = {};
            datiFiltrati.forEach(t => {
                if (!t.Data) return;
                const meseKey = t.Data.substring(0, 7);
                if (!mesiMap[meseKey]) mesiMap[meseKey] = [];
                mesiMap[meseKey].push(t);
            });

            const giorniSettimanaCorti = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];

            Object.keys(mesiMap).sort().forEach(meseKey => {
                const [annoStr, meseStr] = meseKey.split('-');
                const anno = parseInt(annoStr, 10);
                const mese = parseInt(meseStr, 10);
                const giorniNelMese = new Date(anno, mese, 0).getDate();

                const dataTitolo = new Date(anno, mese - 1, 1);
                const titoloMese = dataTitolo.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });

                const personaleMap = {};
                mesiMap[meseKey].forEach(t => {
                    const nome = (t.Dipendente1 || `Matr. ${t.Matricola || 'N/D'}`).trim();
                    const chiaveOp = `${nome}_${t.Matricola || ''}`;
                    
                    if (!personaleMap[chiaveOp]) {
                        personaleMap[chiaveOp] = {
                            nome: nome,
                            matricola: t.Matricola || '',
                            ruolo: [t.Ruolo, t.Ruolo1].filter(Boolean).join(' - '),
                            turniPerGiorno: {}
                        };
                    }
                    const giornoNum = parseInt(t.Data.substring(8, 10), 10);
                    personaleMap[chiaveOp].turniPerGiorno[giornoNum] = t;
                });

                const elencoPersonale = Object.values(personaleMap).sort((a, b) => a.nome.localeCompare(b.nome));

                let html = `
                    <div class="card border-0 shadow-sm p-3 rounded-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold text-primary text-capitalize mb-0">📅 ${titoloMese}</h5>
                            <span class="badge bg-light text-secondary border">${elencoPersonale.length} operatori</span>
                        </div>
                        <div class="matrix-wrapper">
                            <table class="matrix-table">
                                <thead>
                                    <tr>
                                        <th class="sticky-col">Personale</th>
                `;

                for (let g = 1; g <= giorniNelMese; g++) {
                    const dObj = new Date(anno, mese - 1, g);
                    const dayOfWeek = dObj.getDay();
                    const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
                    const nomeGiorno = giorniSettimanaCorti[dayOfWeek];

                    html += `
                        <th class="day-header ${isWeekend ? 'weekend' : ''}">
                            <div class="fw-normal" style="font-size: 0.65rem;">${nomeGiorno}</div>
                            <div class="fw-bold">${g}</div>
                        </th>
                    `;
                }

                html += `
                                    </tr>
                                </thead>
                                <tbody>
                `;

                elencoPersonale.forEach(op => {
                    html += `
                        <tr>
                            <td class="sticky-col" title="${op.nome} ${op.ruolo ? '(' + op.ruolo + ')' : ''}">
                                <span class="nome-operatore">${op.nome}</span>
                                ${op.ruolo ? `<span class="ruolo-operatore">${op.ruolo}</span>` : ''}
                            </td>
                    `;

                    for (let g = 1; g <= giorniNelMese; g++) {
                        const dObj = new Date(anno, mese - 1, g);
                        const isWeekend = (dObj.getDay() === 0 || dObj.getDay() === 6);
                        const turno = op.turniPerGiorno[g];

                        if (turno) {
                            const desc = (turno.Turno || '').toLowerCase();
                            let bgClass = 'bg-primary text-white';

                            if (desc.includes('pomeriggio')) {
                                bgClass = 'bg-success text-white';
                            } else if (desc.includes('riposo') || desc.includes('festivit') || desc.includes('ferie')) {
                                bgClass = 'bg-danger text-white';
                            }

                            const sigla = turno.SiglaTurno || turno.Turno || '-';
                            const tooltipText = `Turno: ${turno.Turno || 'N/D'}${turno.Orario ? ' - Orario: ' + turno.Orario : ''}${turno.Note ? ' - Note: ' + turno.Note : ''}`;

                            html += `
                                <td class="${isWeekend ? 'cell-weekend' : ''}">
                                    <span class="sigla-pill ${bgClass}" title="${tooltipText}">${sigla}</span>
                                </td>
                            `;
                        } else {
                            html += `<td class="${isWeekend ? 'cell-weekend' : ''}"></td>`;
                        }
                    }

                    html += `</tr>`;
                });

                html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                contenitore.innerHTML += html;
            });
        }
    </script>
</body>
</html>
