<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <title>Tabellone Turni Reparto</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icona.png">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* Navbar */
        .app-navbar {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Barra Filtri (Reparto e Mese) */
        .filter-bar {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        /* Contenitore Tabellone con scorrimento orizzontale fluido */
        .matrix-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
        }

        .matrix-table {
            border-collapse: separate;
            border-spacing: 0;
            width: max-content;
            min-width: 100%;
            margin-bottom: 0;
        }

        .matrix-table th,
        .matrix-table td {
            border-right: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
            padding: 4px 2px;
            text-align: center;
            vertical-align: top !important;
        }

        .matrix-table tr:last-child td {
            border-bottom: none;
        }

        /* Prima colonna fissa (Personale) allineata in alto */
        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 2;
            background-color: #ffffff;
            min-width: 160px;
            max-width: 160px;
            text-align: left !important;
            padding: 8px 12px !important;
            border-right: 2px solid #cbd5e1 !important;
            box-shadow: 2px 0 5px -2px rgba(0,0,0,0.05);
            vertical-align: top !important;
        }

        .matrix-table thead th.sticky-col {
            z-index: 3;
            background-color: #f8fafc;
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.8rem;
            vertical-align: middle !important;
        }

        /* Intestazione Giorni */
        .day-header {
            min-width: 58px;
            max-width: 58px;
            background-color: #f8fafc;
            font-size: 0.72rem;
            line-height: 1.2;
            vertical-align: middle !important;
        }

        .day-header.weekend {
            background-color: #fef2f2;
            color: #dc2626;
        }

        .cell-weekend {
            background-color: #fffafa;
        }

        /* Cella del giorno con contenuto esteso */
        .matrix-table td {
            min-width: 58px;
            max-width: 58px;
            height: 65px;
        }

        /* Badge Sigla nella cella */
        .sigla-pill {
            display: inline-block;
            width: 90%;
            padding: 2px 2px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
            margin-bottom: 2px;
        }

        .nome-operatore {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        /* Ruolo e Ruolo1 dentro la cella del giorno (senza sfondo, allineati in alto) */
        .cell-ruolo {
            font-size: 0.58rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            line-height: 1.1;
            background: transparent !important;
            margin-bottom: 1px;
        }

        .cell-ruolo1 {
            font-size: 0.52rem;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            line-height: 1.1;
            background: transparent !important;
        }
    </style>
</head>
<body>

    <!-- Barra Superiore -->
    <nav class="navbar app-navbar py-3 mb-4">
        <div class="container-fluid px-3 px-md-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <span class="navbar-brand mb-0 h1 fw-bold fs-5 text-white ms-1">📊 Tabellone Reparto</span>
            </div>
            <button onclick="caricaDatiTabellone()" class="btn btn-light btn-sm rounded-pill px-3 fw-semibold shadow-sm">🔄 Aggiorna</button>
        </div>
    </nav>

    <div class="container-fluid px-3 px-md-4 pb-5">
        
        <!-- Barra Filtri (Reparto e Mese con menu a tendina) -->
        <div class="filter-bar mb-4 border">
            <div class="row align-items-center g-3">
                <div class="col-12 col-md-6">
                    <label for="filtro-reparto" class="form-label fw-bold text-secondary small mb-1">🏥 Filtra per Reparto</label>
                    <select id="filtro-reparto" class="form-select fw-semibold" onchange="renderizzaTabellone()">
                        <option value="TUTTI">Tutti i reparti</option>
                    </select>
                </div>
                <div class="col-12 col-md-6">
                    <label for="filtro-mese" class="form-label fw-bold text-secondary small mb-1">📅 Filtra per Mese</label>
                    <select id="filtro-mese" class="form-select fw-semibold" onchange="renderizzaTabellone()">
                        <option value="TUTTI">Tutti i mesi</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Loader -->
        <div id="loader" class="text-center py-5" style="display: none;">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
            <p id="loader-text" class="mt-3 text-muted fw-medium">Caricamento tabellone in corso...</p>
        </div>

        <!-- Contenitore Tabelle Mensili -->
        <div id="contenitore-mesi" class="d-flex flex-column gap-4">
            <!-- I mesi verranno generati dinamicamente qui -->
        </div>

    </div>

    <script>
        // --- CONFIGURAZIONE SUPABASE ---
        const SUPABASE_URL = 'https://uwoniioltnihmqakkzjv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Rx8MkwKEJLqZBZtbp-2IYw_rFUvKFin';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let tuttiIDati = [];

        window.onload = () => {
            caricaDatiTabellone();
        };

        // Caricamento con paginazione a blocchi per evitare limiti di righe
        async function caricaDatiTabellone() {
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loader-text');
            const contenitore = document.getElementById('contenitore-mesi');
            
            contenitore.innerHTML = '';
            loader.style.display = 'block';

            const ora = new Date();
            const primoGiornoMeseCorrente = `${ora.getFullYear()}-${String(ora.getMonth() + 1).padStart(2, '0')}-01`;

            let datiRaccolti = [];
            let pageSize = 1000;
            let page = 0;
            let hasMore = true;

            try {
                while (hasMore) {
                    loaderText.innerText = `Caricamento dati in corso (recuperati ${datiRaccolti.length} record)...`;

                    const { data, error } = await supabaseClient
                        .from('Turnistica')
                        .select('*')
                        .gte('Data', primoGiornoMeseCorrente)
                        .order('Data', { ascending: true })
                        .range(page * pageSize, (page + 1) * pageSize - 1);

                    if (error) throw error;

                    if (data && data.length > 0) {
                        datiRaccolti = datiRaccolti.concat(data);
                        if (data.length < pageSize) {
                            hasMore = false;
                        } else {
                            page++;
                        }
                    } else {
                        hasMore = false;
                    }
                }
            } catch (err) {
                loader.style.display = 'none';
                contenitore.innerHTML = '<div class="alert alert-danger rounded-3 border-0 shadow-sm p-3">Errore di connessione al database. Riprova più tardi.</div>';
                console.error(err);
                return;
            }

            loader.style.display = 'none';

            if (datiRaccolti.length === 0) {
                contenitore.innerHTML = '<div class="alert alert-info rounded-3 border-0 shadow-sm p-4 text-center">Nessun turno trovato nel database.</div>';
                return;
            }

            tuttiIDati = datiRaccolti;
            popolaFiltri(tuttiIDati);
            renderizzaTabellone();
        }

            const selectMese = document.getElementById('filtro-mese');

            const repValorePrecedente = selectReparto.value;
            const meseValorePrecedente = selectMese.value;

                const rep = row.NomeReparto || row.nomereparto || row.nome_reparto || row.Reparto || '';
                if (rep.trim() !== '') {
                    repartiSet.add(rep.trim());

                if (
